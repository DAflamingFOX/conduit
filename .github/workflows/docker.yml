name: CI & Docker Hub Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run Go Unit Tests
        run: go test -v ./...

  docker-publish:
    name: Build & Push Docker Hub Images
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Tags & Labels for Manager
        id: meta-manager
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/conduit-manager
          tags: |
            # Always generated for every build (commit short SHA and 'dev' tag)
            type=sha,format=short,prefix=
            type=raw,value=dev
            # Additional tags for Git releases (version number and 'stable' tag)
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Extract Docker Tags & Labels for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/conduit-worker
          tags: |
            # Always generated for every build (commit short SHA and 'dev' tag)
            type=sha,format=short,prefix=
            type=raw,value=dev
            # Additional tags for Git releases (version number and 'stable' tag)
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Push Conduit Manager
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.manager
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}

      - name: Build and Push Conduit Worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
